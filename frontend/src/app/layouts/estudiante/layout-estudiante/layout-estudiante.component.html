<div class="page">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-inner">
      <!-- Brand -->
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <img src="/img/unu-logo.png" alt="" width="40" height="40">
        </div>
        <div class="brand-text">
          <h1 class="brand-title">UNU Incidencias</h1>
          <p class="brand-subtitle">Reportes de averías e incidencias</p>
        </div>
      </div>
      <!-- Top Actions: Tabs + Botones + Usuario -->
      <div class="top-actions">
        <!-- Tabs de orden (desktop) -->
        <div class="tabs" role="tablist" aria-label="Orden de reportes">
          <button mat-button type="button" class="eu-tab" [class.active]="activeTab === 'ultimos'" (click)="setActiveTab('ultimos')">
            <mat-icon>history</mat-icon>
            <span>Últimos</span>
          </button>
          <button mat-button type="button" class="eu-tab" [class.active]="activeTab === 'populares'" (click)="setActiveTab('populares')">
            <mat-icon>trending_up</mat-icon>
            <span>Populares</span>
          </button>
          <button mat-button type="button" class="eu-tab" [class.active]="activeTab === 'mis-reportes'" (click)="setActiveTab('mis-reportes')">
            <mat-icon>folder_shared</mat-icon>
            <span>Mis reportes</span>
          </button>
        </div>
        <!-- Botones de acción -->
        <div class="actions">
          <button mat-button type="button" class="eu-ghost" title="Cerrar sesión" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span class="btn-text">Salir</span>
          </button>
        </div>
        <!-- Usuario chip -->
        <div *ngIf="estudiante" class="user-chip">
          <div class="user-avatar" aria-hidden="true">
            {{ obtenerIniciales(estudiante.nombres + ' ' + estudiante.apellido_paterno) }}
          </div>
          <div class="user-info">
            <div class="user-name">{{ estudiante.nombres }} {{ estudiante.apellido_paterno }}</div>
            <div class="user-hint">Estudiante</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido dinámico -->
  <div class="layout">
    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Navegación inferior móvil (estilo Twitter/IG: solo ≤640px) -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button type="button" class="bn-item" [class.active]="activeTab === 'ultimos'" (click)="setActiveTab('ultimos')">
      <mat-icon>history</mat-icon>
      <span>Últimos</span>
    </button>
    <button type="button" class="bn-item" [class.active]="activeTab === 'populares'" (click)="setActiveTab('populares')">
      <mat-icon>trending_up</mat-icon>
      <span>Populares</span>
    </button>
    <button type="button" class="bn-item bn-new" (click)="irNuevo()" aria-label="Nuevo reporte">
      <mat-icon>add</mat-icon>
    </button>
    <button type="button" class="bn-item" [class.active]="activeTab === 'mis-reportes'" (click)="setActiveTab('mis-reportes')">
      <mat-icon>folder_shared</mat-icon>
      <span>Mis reportes</span>
    </button>
    <button type="button" class="bn-item" (click)="logout()" aria-label="Cerrar sesión">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </nav>
</div>
