<div class="page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <img src="/img/unu-logo.png" alt="" width="40" height="40">
        </div>
        <div class="brand-text">
          <h1 class="brand-title">UNU Incidencias</h1>
          <p class="brand-subtitle">Panel trabajador</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="tabs" role="tablist">
          <button mat-button type="button" class="eu-tab" routerLink="/trabajador/reportes-pendientes" routerLinkActive="active">
            <mat-icon>pending_actions</mat-icon>
            <span>Pendientes</span>
          </button>
          <button mat-button type="button" class="eu-tab" routerLink="/trabajador/reportes-aceptados" routerLinkActive="active">
            <mat-icon>check_circle</mat-icon>
            <span>Aceptados</span>
          </button>
          <button mat-button type="button" class="eu-tab" routerLink="/trabajador/reportes-solucionados" routerLinkActive="active">
            <mat-icon>task_alt</mat-icon>
            <span>Solucionados</span>
          </button>
          <button mat-button type="button" class="eu-tab" routerLink="/trabajador/estadisticas" routerLinkActive="active">
            <mat-icon>bar_chart</mat-icon>
            <span>Estadísticas</span>
          </button>
        </div>

        <div class="actions">
          <button mat-button type="button" class="eu-ghost" title="Cerrar sesión" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span class="btn-text">Salir</span>
          </button>
        </div>

        <div *ngIf="trabajador" class="user-chip">
          <div class="user-avatar" aria-hidden="true">
            {{ obtenerIniciales(trabajador.nombres + ' ' + trabajador.apellido_paterno) }}
          </div>
          <div class="user-info">
            <div class="user-name">{{ trabajador.nombres }} {{ trabajador.apellido_paterno }}</div>
            <div class="user-hint">Trabajador</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Navegación inferior móvil (solo ≤640px) -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <a class="bn-item" routerLink="/trabajador/reportes-pendientes" routerLinkActive="active">
      <mat-icon>pending_actions</mat-icon>
      <span>Pendientes</span>
    </a>
    <a class="bn-item" routerLink="/trabajador/reportes-aceptados" routerLinkActive="active">
      <mat-icon>check_circle</mat-icon>
      <span>Aceptados</span>
    </a>
    <a class="bn-item" routerLink="/trabajador/reportes-solucionados" routerLinkActive="active">
      <mat-icon>task_alt</mat-icon>
      <span>Solucionados</span>
    </a>
    <a class="bn-item" routerLink="/trabajador/estadisticas" routerLinkActive="active">
      <mat-icon>bar_chart</mat-icon>
      <span>Datos</span>
    </a>
    <button type="button" class="bn-item" (click)="logout()" aria-label="Cerrar sesión">
      <mat-icon>logout</mat-icon>
      <span>Salir</span>
    </button>
  </nav>
</div>
