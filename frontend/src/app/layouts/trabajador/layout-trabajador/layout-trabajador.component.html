<div class="page">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">UNU Incidencias</h1>
          <p class="brand-subtitle">PANEL TRABAJADOR</p>
        </div>
      </div>

      <div class="top-actions">
        <div class="tabs" role="tablist">
          <button type="button" class="tab" routerLink="/trabajador/reportes-pendientes" routerLinkActive="active">
            Pendientes
          </button>
          <button type="button" class="tab" routerLink="/trabajador/reportes-aceptados" routerLinkActive="active">
            Aceptados
          </button>
          <button type="button" class="tab" routerLink="/trabajador/reportes-solucionados" routerLinkActive="active">
            Solucionados
          </button>
          <button type="button" class="tab" routerLink="/trabajador/reportes-rechazados" routerLinkActive="active">
            Rechazados
          </button>
          <button type="button" class="tab" routerLink="/trabajador/estadisticas" routerLinkActive="active">
            Estadísticas
          </button>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-ghost" title="Cerrar sesión" (click)="logout()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <path d="M16 17l5-5-5-5" />
              <path d="M21 12H9" />
            </svg>
            <span class="btn-text">Salir</span>
          </button>
        </div>

        <div *ngIf="trabajador" class="user-chip">
          <div class="user-avatar" aria-hidden="true">
            {{ obtenerIniciales(trabajador.nombres + ' ' + trabajador.apellido_paterno) }}
          </div>
          <div class="user-info">
            <div class="user-name">{{ trabajador.nombres }} {{ trabajador.apellido_paterno }}</div>
            <div class="user-hint">Trabajador</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="layout">
    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
