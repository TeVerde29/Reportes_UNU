<div class="d-flex vh-100 overflow-hidden">

  <aside class="d-flex flex-column flex-shrink-0 p-3 text-white shadow"
        style="width: 280px; background-color: var(--green); z-index: 1050;">

    <div class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none border-bottom pb-3 w-100">
      <i class="bi bi-shield-lock-fill fs-4 me-2" style="color: var(--green-2)"></i>
      <span class="fs-5 fw-bold text-uppercase tracking-wider">Trabajador</span>
    </div>

    <ul class="nav nav-pills flex-column mb-auto mt-4">
      <li class="nav-item mb-2">
        <a
          class="nav-link text-white custom-nav d-flex align-items-center"
          (click)="irPendientes()"
          [class.active]="router.url === '/trabajador/reportes-pendientes'"
        >
          <i class="bi bi-hourglass-split me-2"></i>
          <span>Reportes pendientes</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/trabajador/reportes-aceptados"
          routerLinkActive="active"
          class="nav-link text-white custom-nav d-flex align-items-center">
          <i class="bi bi-check2-all me-2"></i>
          <span>Reportes aceptados</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/trabajador/reportes-solucionados"
          routerLinkActive="active"
          class="nav-link text-white custom-nav d-flex align-items-center">
          <i class="bi bi-hammer me-2"></i>
          <span>Reportes solucionados</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/trabajador/reportes-rechazados"
          routerLinkActive="active"
          class="nav-link text-white custom-nav d-flex align-items-center">
          <i class="bi bi-x-circle me-2"></i>
          <span>Reportes Rechazados</span>
        </a>
      </li>
      <li class="nav-item mb-2">
        <a routerLink="/trabajador/estadisticas"
          routerLinkActive="active"
          class="nav-link text-white custom-nav d-flex align-items-center">
          <i class="bi bi-bar-chart-line me-2"></i>
          <span>Estadísticas</span>
        </a>
      </li>
    </ul>

    <div class="mt-auto">
      <hr class="text-white-50">
      <button (click)="logout()"
              class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center py-2 border-0 shadow-sm"
              style="background: rgba(255,255,255,0.05);">
        <i class="bi bi-box-arrow-left me-2"></i>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <div class="d-flex flex-column flex-grow-1 overflow-auto" style="background-color: var(--bg);">

    <header class="navbar navbar-expand-lg bg-white border-bottom px-4 shadow-sm sticky-top" style="height: 70px;">
      <div class="container-fluid d-flex justify-content-between">

        <span class="navbar-text text-dark fs-6">
          Bienvenido,
          <strong style="color: var(--green);">
            <ng-container *ngIf="trabajador; else loadingName">
              {{ trabajador.nombres }} {{ trabajador.apellido_paterno }}
            </ng-container>
            <ng-template #loadingName>
              <span class="spinner-border spinner-border-sm text-success mx-1" role="status"></span>
              Cargando...
            </ng-template>
          </strong>
        </span>

        <div class="d-flex align-items-center">
          <button class="btn border-0 position-relative p-2"
                  style="background-color: var(--green-soft); color: var(--green); border-radius: 10px;">
            <i class="bi bi-bell fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill border border-2 border-white"
                  style="background-color: var(--green-2);">
              3+
            </span>
          </button>
        </div>

      </div>
    </header>

    <main class="p-4 flex-grow-1">
      <div class="container-fluid">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
