<div class="container-fluid py-4">

  <div class="d-flex align-items-center mb-4">
    <h2 class="h4 fw-bold mb-0" style="color: var(--text); border-left: 5px solid var(--green); padding-left: 15px;">
      Reportes Aceptados
    </h2>
  </div>

  <div class="card border-0 shadow-sm" style="border-radius: 15px; background-color: var(--card);">
    <div class="card-body p-0">
      <div class="table-responsive" *ngIf="!error && reportes.length > 0">
        <table class="table table-hover align-middle mb-0">
          <thead style="background-color: var(--bg); color: var(--muted);">
            <tr>
              <th class="text-center border-0">N°</th>
              <th class="border-0">Título</th>
              <th class="border-0">Estudiante</th>
              <th class="border-0 d-none d-md-table-cell">Carrera</th>
              <th class="border-0 text-center">Tipo</th>
              <th class="border-0">Ubicación</th>
              <th class="border-0">Fecha</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let r of reportes; let i = index">
              <td class="ps-4 fw-bold text-primary">
                {{ i + 1 }}
              </td>
              <td>
                <div class="fw-medium" style="color: var(--text);">{{ r.titulo }}</div>
              </td>
              <td style="color: var(--muted); font-size: 0.9rem;">{{ r.estudiante }}</td>
              <td class="d-none d-md-table-cell text-truncate" style="max-width: 150px;">{{ r.carrera }}</td>
              <td class="text-center">
                <span class="badge rounded-pill px-3 py-2"
                      style="background-color: var(--green-soft); color: var(--green); font-weight: 600;">
                  {{ r.tipo_problema }}
                </span>
              </td>
              <td>
                <span class="text-muted"><i class="bi bi-geo-alt me-1"></i>{{ r.ubicacion }}</span>
              </td>
              <td class="text-muted">{{ r.fecha_edicion }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="!error && reportes.length === 0" class="text-center py-5">
        <i class="bi bi-clipboard-x display-1 text-muted opacity-25"></i>
        <p class="mt-3 text-muted fw-medium">No hay reportes a solucionar en este momento.</p>
      </div>
    </div>
  </div>
</div>
