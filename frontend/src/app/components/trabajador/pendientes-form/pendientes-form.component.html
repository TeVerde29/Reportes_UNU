<div class="modal-backdrop fade show" *ngIf="reporte"></div>

<div class="modal d-block" tabindex="-1" *ngIf="reporte">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content custom-modal">

      <div class="modal-header">
        <div class="header-content">
          <div class="header-indicator"></div>
          <div>
            <h5 class="modal-title">Detalle de Incidencia</h5>
            <p class="modal-subtitle">ID Reporte: #{{ reporte.id_reporte }}</p>
          </div>
        </div>
        <button type="button" class="btn-close-custom" (click)="cancelar()">✕</button>
      </div>

      <div class="modal-body custom-body">
        <div class="row g-4">
          <div class="col-12">
            <label class="custom-label">Título de la Incidencia</label>
            <input type="text" class="custom-input" [(ngModel)]="form.titulo" [disabled]="tipoEstado !== 'Pendiente'">
          </div>

          <div class="col-12">
            <label class="custom-label">Descripción Detallada</label>
            <textarea class="custom-input" rows="3" [(ngModel)]="form.descripcion" [disabled]="tipoEstado !== 'Pendiente'"></textarea>
          </div>

          <div class="col-md-6">
            <label class="custom-label">Categoría de Problema</label>
            <select class="custom-select" [(ngModel)]="form.id_tipo_problema" [disabled]="tipoEstado !== 'Pendiente'">
              <option *ngFor="let t of tiposProblema" [ngValue]="t.id_tipo_problema">
                {{ t.nombre }}
              </option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="custom-label">Estudiante Solicitante</label>
            <div class="read-only-box">{{ reporte.estudiante }}</div>
          </div>

          <div class="col-md-12">
            <label class="custom-label">Ubicación Reportada</label>
            <div class="read-only-box location">
              <i class="bi bi-geo-alt"></i> {{ reporte.ubicacion }}
            </div>
          </div>

          <div class="col-12" *ngIf="reporte.foto_url">
            <label class="custom-label">Evidencia Visual</label>
            <div class="image-container">
              <img [src]="'http://localhost:3000' + reporte.foto_url" class="img-evidence">
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer custom-footer">
        <button class="btn-cancel" (click)="cancelar()">Cerrar</button>

        <div class="action-group" *ngIf="tipoEstado === 'Pendiente'">
          <button class="btn-reject" (click)="rechazar()">Rechazar Reporte</button>
          <button class="btn-accept" (click)="aceptar()">Aceptar Reporte</button>
        </div>

        <button *ngIf="tipoEstado === 'Aceptado'" class="btn-solve" (click)="solucionar()">
          Marcar como Solucionado
        </button>
      </div>

    </div>
  </div>
</div>
