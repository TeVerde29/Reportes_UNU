<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNU - Reporte</title>

  <style>
    :root {
      --unu-green: #006400;
      --unu-bg: #e8f5e9;

      /* Croquis (colores del nuevo diseño) */
      --campus-bg: #eef2f3;
      --street: #cfd4d8;
      --grass: #b2f2bb;
      --bld-blue: #a5d8ff;
      --bld-yellow: #ffec99;
      --bld-pink: #ffd6d6;

      --stroke: #111;
      --stroke-soft: rgba(0, 0, 0, 0.35);
      --active: #626D22;
      --active-stroke: #3B5F2D;
      --active-font-color: #ffffff;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #f0f0f0;
    }

    /* --- COLUMNA IZQUIERDA (FORMULARIO) --- */
    .sidebar {
      width: 350px;
      background: white;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      overflow-y: auto;
      z-index: 10;
    }

    .sidebar h2 {
      color: var(--unu-green);
      margin-top: 0;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .selected-box {
      background: var(--unu-bg);
      border: 1px solid var(--unu-green);
      color: var(--unu-green);
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
    }

    button {
      background: var(--unu-green);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #004d00;
    }

    /* --- COLUMNA DERECHA (MAPA SVG) --- */
    .map-area {
      flex-grow: 1;
      position: relative;
      overflow: auto; /* IMPORTANTE: el croquis es vertical (alto), se ve con scroll */
      padding: 18px;
      display: block;
    }

    svg {
      width: 100%;
      max-width: 980px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: transparent;
    }

    /* --- ESTILOS DEL CROQUIS --- */
    .barra-calle {
      fill: var(--street);
      stroke: var(--stroke);
      stroke-width: 3;
    }

    .campus {
      fill: var(--campus-bg);
      stroke: var(--stroke);
      stroke-width: 4;
    }

    .area-verde {
      fill: var(--grass);
      stroke: var(--stroke);
      stroke-width: 3;
    }

    /* Interactivos */
    .edificio {
      cursor: pointer;
      stroke: var(--stroke);
      stroke-width: 3;
      transition: filter 0.15s ease, stroke-width 0.15s ease;
    }

    .edificio[data-cat="blue"] {
      fill: var(--bld-blue);
    }

    .edificio[data-cat="yellow"] {
      fill: var(--bld-yellow);
    }

    .edificio[data-cat="pink"] {
      fill: var(--bld-pink);
    }

    .edificio[data-cat="grass"] {
      fill: var(--grass);
    }

    .edificio:hover {
      filter: brightness(0.97) drop-shadow(0 2px 6px var(--stroke-soft));
      stroke-width: 4;
    }

    .edificio.active {
      fill: var(--active) !important;
      stroke: var(--active-stroke);
      stroke-width: 5;
      filter: none;
    }

    /* Texto */
    .txt {
      font-family: "Segoe UI", sans-serif;
      fill: #1f1f1f;
      text-anchor: middle;
      font-weight: 600;
      pointer-events: none;
    }

    .txt.calle {
      font-size: 18px;
      font-weight: 700;
    }

    .txt.big {
      font-size: 18px;
      font-weight: 700;
    }

    .txt.mid {
      font-size: 13px;
      font-weight: 700;
    }

    .edificio.active + text {
    fill: var(--active-font-color) !important;
    }
  </style>
</head>

    <script>
    // ====== MAPA / SVG: selección compatible con celulares ======
    const ubicaciones = document.querySelectorAll(".edificio");
    const inputId = document.getElementById("id_ubicacion");
    const display = document.getElementById("ubicacion-display");

    // (Opcional) input file de foto: <input id="foto" type="file" accept="image/*" capture="environment" />
    const fotoInput = document.getElementById("foto"); // si no existe, no pasa nada

    function getUbicacionValue(el) {
      return el.dataset.id || el.dataset.key || el.id;
    }

    function getUbicacionName(el) {
      return el.dataset.name || el.dataset.key || el.id;
    }

    function seleccionarUbicacion(el) {
      // 1) limpiar selección
      ubicaciones.forEach((x) => x.classList.remove("active"));

      // 2) activar actual
      el.classList.add("active");

      // 3) setear formulario
      const valor = getUbicacionValue(el);
      const nombre = getUbicacionName(el);

      inputId.value = valor;
      display.textContent = nombre;
      display.style.backgroundColor = "#c8e6c9";
    }

    // Evento “universal” para móvil + desktop
    const EVT_SELECT = window.PointerEvent ? "pointerdown" : "click";

    ubicaciones.forEach((u) => {
      // Mejora de accesibilidad (también sirve en algunos móviles con teclado)
      u.setAttribute("tabindex", "0");

      // En SVG a veces el tap no “pega” si no hay fill; esto ayuda si tu CSS no lo cubre:
      // u.style.pointerEvents = "all";

      u.addEventListener(
        EVT_SELECT,
        (e) => {
          // En pantallas táctiles, evitamos doble-tap/zoom y clicks fantasmas
          // (ojo: dependiendo del navegador, puede variar)
          if (e.pointerType === "touch" || e.pointerType === "pen") {
            e.preventDefault();
          }
          seleccionarUbicacion(u);
        },
        { passive: false } // necesario para que preventDefault funcione en algunos casos
      );

      // Soporte teclado: Enter o Space
      u.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          seleccionarUbicacion(u);
        }
      });
    });

    // ====== ENVÍO (con foto si existe) ======
    document.getElementById("reportForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!inputId.value) {
        alert("⚠️ Selecciona una ubicación en el mapa");
        return;
      }

      // Si tu formulario NO envía al backend todavía, deja el alert.
      // Si SÍ quieres enviar, usa FormData (soporta imagen).
      const fd = new FormData(e.target);
      // Asegurar id_ubicacion (por si es input hidden)
      fd.set("id_ubicacion", inputId.value);

      // Validar foto solo si existe el input
      if (fotoInput) {
        const file = fotoInput.files && fotoInput.files[0];
        if (!file) {
          alert("⚠️ Adjunta una foto (evidencia)");
          return;
        }
        if (!file.type.startsWith("image/")) {
          alert("⚠️ Solo se permiten imágenes");
          return;
        }
        // si tu name no es "foto", ajústalo:
        // fd.set("foto", file);
      }

      try {
        // Cambia esta URL a tu endpoint real
        const res = await fetch("/api/reportes", {
          method: "POST",
          body: fd,
        });

        if (!res.ok) {
          alert("❌ Error al enviar el reporte");
          return;
        }

        alert("✅ Reporte enviado para: " + display.textContent + " (id_ubicacion=" + inputId.value + ")");
      } catch (err) {
        alert("❌ No se pudo enviar. Revisa tu conexión o el endpoint.");
      }
    });
  </script>
