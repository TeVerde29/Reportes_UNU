<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
  <label>Código</label>
  <input type="text" formControlName="codigo">
  <br>
  <label>Clave</label>
  <input type="password" formControlName="clave">
  <br>
  <div *ngIf="f['codigo'].touched && f['codigo'].invalid">
    El código es obligatorio.
  </div>
  <div *ngIf="f['clave'].touched && f['clave'].invalid">
    La clave es obligatoria.
  </div>
  <div *ngIf="error">{{ error }}</div>
  <div *ngIf="successMessage">{{ successMessage }}</div>
  <button type="submit" [disabled]="loading">
    {{ loading ? 'Cargando...' : 'Ingresar' }}
  </button>
</form>
